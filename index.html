<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="指で回せる疑似ハンドスピナー。音・振動・見た目までこだわりました。">
<title>Fidget Spinner</title>
<style>
:root{--accent:#cfd8e3;--panel:rgba(18,21,28,.72);--fg:#eef2f7}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07080b;color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;pointer-events:none}
#rpm{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#rpm small{font-size:14px;font-weight:500;opacity:.7;margin-left:6px}
#stats{font-size:13px;opacity:.7;font-variant-numeric:tabular-nums;margin-top:2px}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 112px);text-align:center;font-size:13px;opacity:.6;transition:opacity .8s;pointer-events:none}
#toast{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 118px);text-align:center;font-size:30px;font-weight:800;letter-spacing:.05em;pointer-events:none;opacity:0;text-shadow:0 0 18px var(--accent),0 2px 10px rgba(0,0,0,.6)}
#toast.show{animation:pop 1.4s ease-out}
#toast.lite{font-size:18px;font-weight:600;letter-spacing:.08em;text-shadow:0 1px 8px rgba(0,0,0,.6);opacity:.75}
@keyframes pop{0%{opacity:0;transform:scale(.6)}14%{opacity:1;transform:scale(1.18)}28%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 12px}
#bar button{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:0 14px;min-height:44px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;transition:transform .08s}
#bar button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
#bar button:disabled{opacity:.4}
#bar button:active{transform:scale(.96)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="rpm"><span id="rpmv">0</span><small>rpm</small></div><div id="stats"></div></div>
<div id="toast"></div>
<div id="hint">どこでもスワイプで回る ／ 指を置くと止まる</div>
<div id="bar">
  <button id="bTheme"></button>
  <button id="bArms"></button>
  <button id="bSound"></button>
  <button id="bTimbre"></button>
  <button id="bVib"></button>
  <button id="bBass"></button>
  <button id="bTilt"></button>
  <button id="bFx"></button>
  <button id="bStop">止める</button>
</div>
<script>
(() => {
'use strict';

/* ---------- 定数・設定 ---------- */
const TAU = Math.PI * 2;
// 回転速度に決め打ちの上限はない（空気抵抗で自然に頭打ちになるだけ）
const ARMS = [3, 2, 4, 5];
const THEMES = ['metal', 'neon', 'rainbow', 'wood', 'matte'];
const THEME_NAME = { metal: 'メタル', neon: 'ネオン', rainbow: 'レインボー', wood: 'ウッド', matte: 'マット' };
const TIMBRES = ['metal', 'wood', 'plastic'];
const TIMBRE_NAME = { metal: '金属', wood: '木', plastic: 'プラ' };
const KEY = 'fidget-spinner-v1';
const DEF = { theme: 'metal', timbre: 'metal', arms: 3, sound: true, vib: true, bass: true, tilt: true, fx: 1, best: 0 };

function loadSettings() {
  try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch (e) { return Object.assign({}, DEF); }
}
function saveSettings() {
  try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) { /* 保存できなくても動く */ }
}
const settings = loadSettings();
if (![0, 1, 2].includes(settings.fx)) settings.fx = 1;          // 演出：0=最小 1=控えめ 2=フル
const FXM = [0, 0.45, 1];                                        // 演出の強さ（光のにじみ・尾）
const FX_NAME = ['最小', '控えめ', 'フル'];
const canVib = 'vibrate' in navigator;

const hsl = (h, s, l) => `hsl(${((h % 360) + 360) % 360},${s}%,${l}%)`;
const grad = (c, w, stops) => {
  const g = c.createLinearGradient(0, -w, 0, w);
  for (const [o, col] of stops) g.addColorStop(o, col);
  return g;
};

// テーマごとの見た目
const THEME = {
  metal: {
    arm: (c, w) => grad(c, w, [[0, '#4a525e'], [0.42, '#e9eef4'], [0.6, '#9aa5b2'], [1, '#3a414c']]),
    hub: [[0, '#ffffff'], [0.5, '#b9c2cd'], [1, '#4b5360']],
    hole: '#14181e', ring: '#e6ecf3', edge: 'rgba(255,255,255,.4)', shadow: 'rgba(0,0,0,.55)',
    spark: '255,226,180', accent: '#cfd8e3'
  },
  neon: {
    arm: (c, w) => grad(c, w, [[0, '#1d2333'], [1, '#080a10']]),
    hub: [[0, '#d8fbff'], [0.45, '#1a2536'], [1, '#05070b']],
    hole: '#020304', ring: null, edge: null, shadow: null,   // null = 色相で変化
    spark: '120,240,255', accent: '#3ee8ff'
  },
  rainbow: {
    arm: (c, w, k, n, hue) => { const h = hue + k * 360 / n; return grad(c, w, [[0, hsl(h, 95, 72)], [1, hsl(h, 90, 38)]]); },
    hub: [[0, '#ffffff'], [0.6, '#cccccc'], [1, '#555555']],
    hole: '#101014', ring: '#ffffff', edge: 'rgba(255,255,255,.5)', shadow: 'rgba(0,0,0,.45)',
    spark: '255,255,255', accent: '#ff8fd1'
  },
  wood: {
    arm: (c, w) => grad(c, w, [[0, '#e7bd86'], [0.5, '#b07540'], [1, '#6a3e1c']]),
    hub: [[0, '#f6dcae'], [1, '#6a3e1c']],
    hole: '#2b180a', ring: '#f0cf9a', edge: 'rgba(40,20,8,.5)', shadow: 'rgba(0,0,0,.5)',
    spark: '255,190,110', accent: '#e0a96d'
  },
  matte: {
    arm: (c, w) => grad(c, w, [[0, '#4b505d'], [1, '#20232b']]),
    hub: [[0, '#7a8090'], [1, '#17191f']],
    hole: '#0b0c0f', ring: '#ff5d8f', edge: 'rgba(255,255,255,.12)', shadow: 'rgba(0,0,0,.6)',
    spark: '255,93,143', accent: '#ff5d8f'
  }
};

// 音色（ティック音のパラメータ）
const TIMBRE = {
  metal:   { osc: 'triangle', f: 2600, dec: 0.035, gain: 0.5,  nf: 4500, nq: 4,   nd: 0.02 },
  wood:    { osc: 'sine',     f: 900,  dec: 0.06,  gain: 0.6,  nf: 1800, nq: 1.5, nd: 0.03 },
  plastic: { osc: 'square',   f: 1700, dec: 0.02,  gain: 0.22, nf: 2600, nq: 2,   nd: 0.015 }
};

/* ---------- 状態 ---------- */
const S = {
  theta: 0, prevTheta: 0, omega: 0, gripV: 0,
  turns: 0, tickIdx: null, lastRpm: -1,
  hue: 200, dragging: false, particles: [], rings: [], trail: [], ripples: [], tx: 0, ty: 0, tx0: 0, ty0: 0, b0: null, g0: 0, txSlow: 0, tySlow: 0, acc: 0, acc0: 0, shakeE: 0, moveTotal: 0, gx: 0, gy: 0, gz: 0, motionSeen: false, lastRattle: 0, tiltReq: false, tiltSeen: false, L: 0, frameDt: 1 / 60, shake: 0, flash: 0, milestone: 0, recordShown: false
};
let drag = null;             // 指の操作中の情報
let dirty = false, lastSave = 0;

/* ---------- DOM ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const rpmEl = document.getElementById('rpmv');
const statsEl = document.getElementById('stats');
const hintEl = document.getElementById('hint');
const toastEl = document.getElementById('toast');
const bTheme = document.getElementById('bTheme');
const bArms = document.getElementById('bArms');
const bSound = document.getElementById('bSound');
const bTimbre = document.getElementById('bTimbre');
const bVib = document.getElementById('bVib');
const bBass = document.getElementById('bBass');
const bTilt = document.getElementById('bTilt');
const bFx = document.getElementById('bFx');
const bStop = document.getElementById('bStop');

let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, R = 100;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R = Math.min(W, H) * 0.38;
  cx = W / 2; cy = H * 0.45;
}
window.addEventListener('resize', resize);
resize();

/* ---------- オーディオ（Web Audio で合成） ---------- */
let ac = null, master = null, noiseBuf = null;
let whirrGain, whirrFilter, humOsc, humGain;
let bassMaster, bassAmp, lfo, lfoGain, shaper, lastThump = 0;
let whine, whineGain, tone, pan, echoSend, echo, echoFb;

function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    ac = new AC();
    master = ac.createGain(); master.gain.value = settings.sound ? 0.9 : 0;
    // 傾きで変わる「こもり具合」と左右の定位
    tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 12000; tone.Q.value = 0.7;
    pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
    const out = pan || ac.destination;
    master.connect(tone);
    tone.connect(out);
    if (pan) pan.connect(ac.destination);
    // 動かした量に応じて広がる残響（エコー）。最初は小さく、動かすほど空間が広がる
    echoSend = ac.createGain(); echoSend.gain.value = 0.04;
    echo = ac.createDelay(1.0); echo.delayTime.value = 0.12;
    echoFb = ac.createGain(); echoFb.gain.value = 0.32;
    const echoLP = ac.createBiquadFilter(); echoLP.type = 'lowpass'; echoLP.frequency.value = 2800;
    tone.connect(echoSend); echoSend.connect(echo); echo.connect(echoLP);
    echoLP.connect(echoFb); echoFb.connect(echo); echoLP.connect(out);

    // ノイズ素材（1秒のホワイトノイズ）
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    // ベアリングの「シャー」というノイズ（速度で音量・音程が変化）
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    whirrFilter = ac.createBiquadFilter(); whirrFilter.type = 'bandpass'; whirrFilter.Q.value = 0.9; whirrFilter.frequency.value = 300;
    whirrGain = ac.createGain(); whirrGain.gain.value = 0;
    src.connect(whirrFilter).connect(whirrGain).connect(master); src.start();

    // ブレードが通過する「ブーン」という低音
    humOsc = ac.createOscillator(); humOsc.type = 'sawtooth'; humOsc.frequency.value = 40;
    const humLP = ac.createBiquadFilter(); humLP.type = 'lowpass'; humLP.frequency.value = 900;
    humGain = ac.createGain(); humGain.gain.value = 0;
    humOsc.connect(humLP).connect(humGain).connect(master); humOsc.start();

    // 速さに応じて上がり続ける「ヒュイーン」（対数で上がるので頭打ちを感じにくい）
    whine = ac.createOscillator(); whine.type = 'sine'; whine.frequency.value = 400;
    whineGain = ac.createGain(); whineGain.gain.value = 0;
    whine.connect(whineGain).connect(master); whine.start();

    // 「音で振動」：低音でスピーカーを震わせる（通常の音とは別の経路。音OFFでも鳴らせる）
    bassMaster = ac.createGain(); bassMaster.gain.value = settings.bass ? 1 : 0;
    // 少し歪ませて上の倍音を足す（小さいスピーカーは低音が出にくいので体感を稼ぐ）
    shaper = ac.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 2.2); }
    shaper.curve = curve;
    shaper.connect(bassMaster); bassMaster.connect(ac.destination);

    // 回転中のゴロゴロ：低い音をブレードが通る速さで脈打たせる
    const rumble = ac.createOscillator(); rumble.type = 'sine'; rumble.frequency.value = 80;
    bassAmp = ac.createGain(); bassAmp.gain.value = 0;
    lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 10;
    lfoGain = ac.createGain(); lfoGain.gain.value = 0;
    lfo.connect(lfoGain).connect(bassAmp.gain);
    rumble.connect(bassAmp).connect(shaper);
    rumble.start(); lfo.start();
  } catch (e) { ac = null; }
}

// 1回のティック音（ブレードが固定点を通過した時）
function click(vol) {
  if (!ac || !settings.sound || vol <= 0.01) return;
  const T = TIMBRE[settings.timbre] || TIMBRE.metal;
  const t = ac.currentTime;
  const pf = 1 + S.ty * 0.2 + S.tySlow * 0.1;   // 今の傾きと、しばらくの傾きの平均で音程が変わる

  const o = ac.createOscillator();
  o.type = T.osc;
  o.frequency.setValueAtTime(T.f * pf * (0.95 + Math.random() * 0.1), t);
  o.frequency.exponentialRampToValueAtTime(T.f * pf * 0.6, t + T.dec);
  const og = ac.createGain();
  og.gain.setValueAtTime(T.gain * vol, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + T.dec);
  o.connect(og).connect(master); o.start(t); o.stop(t + T.dec + 0.02);

  const n = ac.createBufferSource(); n.buffer = noiseBuf; n.playbackRate.value = 0.9 + Math.random() * 0.2;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = T.nf; f.Q.value = T.nq;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(0.8 * vol, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + T.nd);
  n.connect(f).connect(ng).connect(master); n.start(t, Math.random() * 0.5); n.stop(t + T.nd + 0.02);
}

// スマホを振った時の「カラカラ」（ベアリングの玉が転がる音）
function rattle(vol) {
  if (!ac || !settings.sound) return;
  const t = ac.currentTime;
  const n = ac.createBufferSource(); n.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200 + Math.random() * 2600; f.Q.value = 5;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.5 * vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  n.connect(f).connect(g).connect(master); n.start(t, Math.random() * 0.5); n.stop(t + 0.04);
}

// はじいた瞬間の「ヒュッ」（ノイズの帯域が上に抜けていく）
function whoosh(vol) {
  if (!ac || !settings.sound) return;
  const t = ac.currentTime;
  const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(3500, t + 0.35);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.35 * vol, t + 0.08);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + 0.55);
}

// 節目の「キラーン」。i が大きいほど高い音
function chime(i) {
  if (!ac || !settings.sound) return;
  const t = ac.currentTime;
  const base = [523.25, 587.33, 659.25, 783.99, 880, 987.77][Math.min(i, 5)];
  [1, 1.5, 2].forEach((m, j) => {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = base * m;
    const g = ac.createGain(), st = t + j * 0.07;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.18, st + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 0.5);
    o.connect(g).connect(master); o.start(st); o.stop(st + 0.55);
  });
}

// 低い「ドン」（キックドラム風）。vol は 0〜1
function thump(vol) {
  if (!ac || !settings.bass || vol <= 0.02) return;
  const now = performance.now();
  if (now - lastThump < 45) return;
  lastThump = now;
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  o.connect(g).connect(shaper); o.start(t); o.stop(t + 0.2);
}

function audioUpdate() {
  if (!ac) return;
  const a = Math.abs(S.omega), t = ac.currentTime;
  bassMaster.gain.setTargetAtTime(settings.bass ? 1 : 0, t, 0.05);
  const depth = settings.bass ? 0.5 * Math.min(1, a / 60) : 0;
  bassAmp.gain.setTargetAtTime(depth * 0.5, t, 0.08);
  lfoGain.gain.setTargetAtTime(depth * 0.5, t, 0.08);
  lfo.frequency.setTargetAtTime(Math.min(45, Math.max(4, a * settings.arms / TAU)), t, 0.05);
  master.gain.setTargetAtTime(settings.sound ? 0.9 : 0, t, 0.05);
  whirrGain.gain.setTargetAtTime(0.2 * Math.min(1, a / 120) * (1 + 0.5 * Math.min(1, S.shakeE / 8)), t, 0.08);
  const tiltPitch = 1 + S.ty * 0.25;
  whirrFilter.frequency.setTargetAtTime((280 + 330 * S.L) * tiltPitch, t, 0.06);      // 速さに対して対数で上がる
  const pass = Math.max(25, a * settings.arms / TAU);
  humOsc.frequency.setTargetAtTime(3000 * Math.tanh(pass / 3000), t, 0.03);           // 頭打ちにならず滑らかに上がる
  humOsc.detune.setTargetAtTime(S.ty * 180 + S.tySlow * 120, t, 0.1);
  whine.frequency.setTargetAtTime(Math.min(6500, 220 * Math.pow(2, S.L * 0.55)) * (1 + S.ty * 0.12), t, 0.05);
  whineGain.gain.setTargetAtTime(settings.sound ? 0.022 * Math.min(1, a / 80) : 0, t, 0.1);
  if (pan) pan.pan.setTargetAtTime(S.tx * 0.85, t, 0.08);                              // 傾けた側から聞こえる
  tone.frequency.setTargetAtTime(Math.min(20000, 9000 * Math.pow(2, S.ty * 1.2 + S.tySlow * 0.8)), t, 0.1);
  // 開いてからの動きの合計が増えるほど、残響が広がる
  const mem = 1 - Math.exp(-S.moveTotal / 25);
  echoSend.gain.setTargetAtTime(0.04 + 0.30 * mem, t, 0.3);
  echoFb.gain.setTargetAtTime(0.32 + 0.22 * mem, t, 0.3);
  echo.delayTime.setTargetAtTime(Math.max(0.03, 0.11 + 0.07 * S.txSlow + 0.04 * mem), t, 0.5);
  humGain.gain.setTargetAtTime(0.035 * Math.min(1, a / 50), t, 0.08);
}

/* ---------- 振動 ---------- */
// iPhone(Safari 17.4+)は navigator.vibrate が無いので、スイッチ型チェックボックスの触覚を使う
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let hapticLabel = null;
if (!canVib && isIOS) {
  hapticLabel = document.createElement('label');
  hapticLabel.setAttribute('aria-hidden', 'true');
  hapticLabel.style.cssText = 'position:fixed;left:-100px;top:0;width:40px;height:40px;opacity:0;pointer-events:none';
  const sw = document.createElement('input');
  sw.type = 'checkbox'; sw.setAttribute('switch', '');
  hapticLabel.appendChild(sw);
  document.body.appendChild(hapticLabel);
}
const canHaptic = canVib || !!hapticLabel;

let lastVib = 0, pendingHaptic = false;
// iOSの触覚は「指で触れた瞬間の処理」の中でしか鳴らないので、
// 回転中に溜まった分は、次の指イベントでまとめて鳴らす
function flushHaptic() {
  if (pendingHaptic && hapticLabel) {
    pendingHaptic = false;
    try { hapticLabel.click(); } catch (e) { /* 無視 */ }
  }
}
function vib(ms) {
  if (!settings.vib || !canHaptic) return;
  const now = performance.now();
  if (now - lastVib < ms + 20) return;   // 前の振動が終わってから次を出す
  lastVib = now;
  try {
    if (canVib) navigator.vibrate(ms);
    else pendingHaptic = true;
  } catch (e) { /* 無視 */ }
}

/* ---------- 物理 ---------- */
const wrap = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };

function physics(dt) {
  const w = S.omega, a = Math.abs(w);
  if (a > 0) {
    // 粘性＋空気抵抗（2乗）＋軸受けの一定摩擦
    const dec = 0.028 * a + 0.000018 * a * a + 0.35;
    const na = a - dec * dt;
    S.omega = na <= 0 ? 0 : Math.sign(w) * na;
  }
  S.theta += S.omega * dt;
}

function onTick(a) {
  const fall = 1 / (1 + Math.pow(a / 220, 3));            // 決め打ちの境目を作らず、連続的に小さくする
  if (a > 8) click(Math.min(1, 0.3 + a / 140) * fall);
  if (a > 6) vib(Math.round(Math.min(30, Math.max(16, 14 + a / 20))));
  if (a > 6) thump(Math.min(1, 0.45 + a / 220) * fall);
}

/* ---------- 傾き（スマホを傾けると音と背景が変わる） ---------- */
function onTilt(e) {
  if (e.beta == null || e.gamma == null) return;
  S.tiltSeen = true;
  if (!settings.tilt) return;
  if (S.b0 === null) { S.b0 = e.beta; S.g0 = e.gamma; }      // 開いた時の持ち方を基準（ゼロ）にする
  S.tx0 = Math.max(-1, Math.min(1, (e.gamma - S.g0) / 35));   // 左右
  S.ty0 = Math.max(-1, Math.min(1, (e.beta - S.b0) / 35));    // 手前・奥
}
// 加速度（揺れ）。重力を除いた値が取れない端末は、ゆっくり変わる成分を重力とみなして引く
function onMotion(e) {
  let ax, ay, az;
  const a = e.acceleration;
  if (a && a.x != null) { ax = a.x; ay = a.y; az = a.z; }
  else {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null) return;
    S.gx = S.gx * 0.9 + g.x * 0.1; S.gy = S.gy * 0.9 + g.y * 0.1; S.gz = S.gz * 0.9 + g.z * 0.1;
    ax = g.x - S.gx; ay = g.y - S.gy; az = g.z - S.gz;
  }
  S.motionSeen = true;
  if (settings.tilt) S.acc0 = Math.hypot(ax, ay, az);
}
function enableTilt() {
  if (S.tiltReq || !settings.tilt) return;
  S.tiltReq = true;
  // iPhoneはユーザー操作の中で許可を求める必要がある（傾きと加速度の両方）
  const ask = (Ctor, onEvent, name) => {
    try {
      if (!Ctor) return;
      if (typeof Ctor.requestPermission === 'function') {
        Ctor.requestPermission().then(r => { if (r === 'granted') window.addEventListener(name, onEvent, true); }).catch(() => {});
      } else window.addEventListener(name, onEvent, true);
    } catch (e) { /* 使えない端末 */ }
  };
  ask(window.DeviceOrientationEvent, onTilt, 'deviceorientation');
  ask(window.DeviceMotionEvent, onMotion, 'devicemotion');
  setTimeout(refreshUI, 2500);
}

/* ---------- 指の操作 ---------- */
function pos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

canvas.addEventListener('pointerdown', e => {
  initAudio();
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  const p = pos(e), now = performance.now();
  drag = { id: e.pointerId, x: p.x, y: p.y, t0: now, lastT: now, lastMove: now, moved: 0, vf: 0, dx: 0, dy: 0 };
  S.trail.length = 0;
  S.trail.push({ x: p.x, y: p.y, t: now });
  S.ripples.push({ x: p.x, y: p.y, life: 0.55, max: 0.55, s: 1 });   // 触れた瞬間の波紋
  S.dragging = true;
  hintEl.style.opacity = 0;
});

canvas.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = pos(e), now = performance.now();
  const dt = Math.max(0.004, (now - drag.lastT) / 1000);
  const rx = drag.x - cx, ry = drag.y - cy;
  const rl = Math.hypot(rx, ry) || 1;
  const dx = p.x - drag.x, dy = p.y - drag.y;
  // 指の動きのうち「円周方向」の成分だけを回転速度にする（画面のどこをなぞっても回る）
  const tang = (rx * dy - ry * dx) / rl;
  const rRef = Math.min(R, Math.max(R * 0.45, rl));      // 中心近くでも暴れないように
  const v = tang / rRef / dt;
  drag.vf = drag.vf * 0.5 + v * 0.5;
  drag.moved += Math.hypot(dx, dy);
  drag.x = p.x; drag.y = p.y; drag.lastT = now; drag.lastMove = now; drag.dx = dx; drag.dy = dy;
  S.trail.push({ x: p.x, y: p.y, t: now });
  if (S.trail.length > 40) S.trail.shift();
});

// 指は「加速させる」だけ。逆向きや往復の戻りは無視（摩擦だけ効く）
// 指を止めて置き続けた時だけブレーキになる
function dragPhysics(dt, now) {
  const sinceMove = now - drag.lastMove;
  if (sinceMove > 250) {                                  // 置きっぱなし＝ブレーキ
    S.omega *= Math.exp(-dt * 4);
    S.theta += S.omega * dt;
    return;
  }
  physics(dt);                                            // 通常の摩擦はそのまま
  if (sinceMove < 60) {                                   // 指が動いている時だけ
    // 同じ向きになぞっている間は、指が遅くても足し算で加速する（ゆっくりなぞっても速くなる）
    const dir = Math.sign(S.omega) || Math.sign(drag.vf);
    const along = drag.vf * dir;
    if (along > 0) {
      S.omega += dir * 22 * along * dt;
      spawnFingerSparks();
    }
    const target = drag.vf * 1.3;                         // 1.3倍＝はじきやすい
    if (Math.abs(target) > Math.abs(S.omega)) {           // 指のほうが速い時だけ引っぱる
      S.omega += (target - S.omega) * (1 - Math.exp(-dt * 20));
    }
  }
}

function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const now = performance.now();
  const isTap = drag.moved < 10 && now - drag.t0 < 250;
  if (isTap) {
    if (Math.abs(S.omega) > 5) { S.omega *= 0.25; vib(25); thump(0.9); }   // タップでブレーキ
  } else if (now - drag.lastMove < 100 && Math.abs(S.omega) > 120) {
    flickFx(Math.abs(S.omega));                                            // はじいた瞬間
  }
  S.ripples.push({ x: drag.x, y: drag.y, life: 0.4, max: 0.4, s: 0.6 });   // 離した時の小さな波紋
  drag = null; S.dragging = false;
}
for (const type of ['pointerdown', 'pointermove', 'pointerup']) {
  canvas.addEventListener(type, flushHaptic);
}
canvas.addEventListener('pointerup', enableTilt);
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('contextmenu', e => e.preventDefault());

// PC用：矢印キーで回す／Spaceでブレーキ
window.addEventListener('keydown', e => {
  initAudio();
  if (e.key === 'ArrowLeft') { S.omega -= 60; hintEl.style.opacity = 0; }
  else if (e.key === 'ArrowRight') { S.omega += 60; hintEl.style.opacity = 0; }
  else if (e.code === 'Space') { S.omega *= 0.2; e.preventDefault(); }
});

/* ---------- 描画 ---------- */
function armPath(c) {
  const tipD = R * 0.66, tipR = R * 0.24, w0 = R * 0.2;
  c.beginPath();
  c.moveTo(0, -w0);
  c.quadraticCurveTo(tipD * 0.5, -w0 * 0.9, tipD, -tipR);
  c.arc(tipD, 0, tipR, -Math.PI / 2, Math.PI / 2, false);
  c.quadraticCurveTo(tipD * 0.5, w0 * 0.9, 0, w0);
  c.closePath();
}

function drawSpinner(th, full, target, ox, oy) {
  const c = target || ctx, name = settings.theme, P = THEME[name], n = settings.arms, step = TAU / n;
  const tipD = R * 0.66, tipR = R * 0.24, hubR = R * 0.2;
  const neonCol = hsl(S.hue, 100, 62);
  const edge = P.edge || neonCol;
  const ring = P.ring || neonCol;
  const shadow = P.shadow || hsl(S.hue, 100, 55);

  c.save();
  c.translate(ox === undefined ? cx : ox, oy === undefined ? cy : oy);
  c.rotate(th);

  for (let k = 0; k < n; k++) {
    c.save();
    c.rotate(k * step);
    if (full) {
      c.shadowColor = shadow;
      c.shadowBlur = (name === 'neon' ? R * 0.22 : R * 0.1) * dpr;
      c.shadowOffsetX = -S.tx * R * 0.08 * dpr;                       // 傾けると影がずれる
      c.shadowOffsetY = (name === 'neon' ? 0 : R * 0.04 + S.ty * R * 0.03) * dpr;
    }
    armPath(c);
    c.fillStyle = P.arm(c, R * 0.24, k, n, S.hue);
    c.fill();
    c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0; c.shadowOffsetY = 0;

    if (full) {                           // 光の向きに来た瞬間に走るハイライト
      const gl = Math.pow(Math.max(0, Math.cos(th + k * step + 0.8 + S.tx * 1.0 - S.ty * 0.7)), 10);
      if (gl > 0.02) {
        c.save(); armPath(c); c.clip();
        const gg = c.createLinearGradient(0, -tipR, 0, tipR);
        gg.addColorStop(0, 'rgba(255,255,255,0)');
        gg.addColorStop(0.5, `rgba(255,255,255,${0.75 * gl})`);
        gg.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = gg; c.fillRect(0, -tipR, tipD + tipR, tipR * 2);
        c.restore();
      }
    }

    if (name === 'wood') {               // 木目
      c.save(); armPath(c); c.clip();
      c.strokeStyle = 'rgba(70,35,12,.22)'; c.lineWidth = 1.2;
      for (let j = -3; j <= 3; j++) {
        const y = j * tipR * 0.3;
        c.beginPath(); c.moveTo(0, y);
        c.bezierCurveTo(tipD * 0.3, y + 4, tipD * 0.6, y - 4, tipD + tipR, y);
        c.stroke();
      }
      c.restore();
    }

    armPath(c);
    c.strokeStyle = edge; c.lineWidth = Math.max(1, R * 0.012); c.stroke();

    // ベアリング穴（先端）
    c.beginPath(); c.arc(tipD, 0, tipR * 0.5, 0, TAU);
    c.fillStyle = P.hole; c.fill();
    c.strokeStyle = ring; c.lineWidth = R * 0.012; c.stroke();
    c.restore();
  }

  // ハブ
  const hg = c.createRadialGradient(-hubR * 0.3, -hubR * 0.3, hubR * 0.05, 0, 0, hubR);
  for (const [o, col] of P.hub) hg.addColorStop(o, col);
  c.beginPath(); c.arc(0, 0, hubR, 0, TAU);
  c.fillStyle = hg; c.fill();
  c.strokeStyle = edge; c.lineWidth = R * 0.012; c.stroke();

  // 中心のベアリングキャップ
  c.beginPath(); c.arc(0, 0, hubR * 0.42, 0, TAU);
  c.fillStyle = name === 'neon' ? '#05070b' : '#262c35'; c.fill();
  c.strokeStyle = ring; c.lineWidth = R * 0.012; c.stroke();
  c.beginPath(); c.arc(0, 0, hubR * 0.12, 0, TAU);
  c.fillStyle = P.hole; c.fill();

  c.restore();
}

function spawnSparks(a) {
  if (settings.fx < 2 || a < 140 || S.particles.length > 80 || Math.random() > 0.6) return;
  const n = settings.arms;
  const k = Math.floor(Math.random() * n);
  const ang = S.theta + k * (TAU / n);
  const r = R * 0.9;
  const sgn = Math.sign(S.omega) || 1;
  const sp = Math.min(2200, a * r * (0.015 + Math.random() * 0.01));
  const dir = ang + sgn * Math.PI / 2;
  const spread = (Math.random() - 0.5) * 0.8;
  S.particles.push({
    x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r,
    vx: Math.cos(dir + spread) * sp + Math.cos(ang) * sp * 0.2,
    vy: Math.sin(dir + spread) * sp + Math.sin(ang) * sp * 0.2,
    life: 0.25 + Math.random() * 0.3, max: 0.5
  });
  S.particles[S.particles.length - 1].max = S.particles[S.particles.length - 1].life;
}

function updateParticles(dt) {
  const arr = S.particles, damp = Math.exp(-6 * dt);
  for (let i = arr.length - 1; i >= 0; i--) {
    const p = arr[i];
    p.life -= dt;
    if (p.life <= 0) { arr.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= damp; p.vy *= damp;
  }
}

const MILES = [500, 1000, 2000, 3000, 4000, 5000, 7500, 10000, 20000, 50000, 100000, 200000, 500000, 1000000];
const DUST = Array.from({ length: 44 }, () => ({
  a: Math.random() * TAU, k: 0.5 + Math.random() * 1.6, s: 0.8 + Math.random() * 1.8, al: 0.12 + Math.random() * 0.3
}));

function glowColor(alpha) {
  const n = settings.theme;
  if (n === 'neon' || n === 'rainbow') return `hsla(${S.hue},100%,60%,${alpha})`;
  return `rgba(${THEME[n].spark},${alpha})`;
}
function addRing(strength) { S.rings.push({ r: R * 0.3, life: 0.7, max: 0.7, s: Math.max(0.35, strength) }); }
function showToast(text) {
  if (settings.fx < 1) return;
  toastEl.textContent = text;
  toastEl.classList.toggle('lite', settings.fx < 2);   // 控えめの時は小さく静かに
  toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show');
}
function flickFx(a) {
  const k = Math.min(1, Math.log2(1 + a / 40) / 6);
  if (settings.fx >= 2) { S.shake = Math.max(S.shake, k); addRing(k); }
  vib(30); thump(1); whoosh(k);
}
// 加速している間、指先から火花が飛ぶ
function spawnFingerSparks() {
  if (settings.fx < 2 || !drag || S.particles.length > 100 || Math.random() > 0.7) return;
  const mv = Math.hypot(drag.dx, drag.dy);
  if (mv < 1) return;
  const ang = Math.atan2(drag.dy, drag.dx) + (Math.random() - 0.5) * 1.2;
  const sp = 180 + Math.random() * 260;
  const life = 0.22 + Math.random() * 0.25;
  S.particles.push({ x: drag.x, y: drag.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life, max: life });
}

function updateFx(dt) {
  for (let i = S.ripples.length - 1; i >= 0; i--) {
    S.ripples[i].life -= dt;
    if (S.ripples[i].life <= 0) S.ripples.splice(i, 1);
  }
  S.shake *= Math.exp(-7 * dt);
  S.flash *= Math.exp(-5 * dt);
  for (let i = S.rings.length - 1; i >= 0; i--) {
    const r = S.rings[i]; r.life -= dt; r.r += R * 2.4 * dt;
    if (r.life <= 0) S.rings.splice(i, 1);
  }
  for (const d of DUST) d.a += (S.omega * 0.05 / (0.6 + d.k) + 0.03 * d.s) * dt;   // 回転に引っぱられるちり
}

function drawFinger(a) {
  const now = performance.now();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // 指の軌跡（新しいほど太く明るい）
  const tr = S.trail;
  while (tr.length && now - tr[0].t > 320) tr.shift();
  if (settings.fx >= 2) for (let i = 1; i < tr.length; i++) {
    const age = (now - tr[i].t) / 320;
    ctx.strokeStyle = glowColor(0.55 * (1 - age));
    ctx.lineWidth = 3 + 11 * (1 - age);
    ctx.beginPath(); ctx.moveTo(tr[i - 1].x, tr[i - 1].y); ctx.lineTo(tr[i].x, tr[i].y); ctx.stroke();
  }

  // 触れている場所の光の玉（回転が速いほど大きく脈打つ）
  if (drag && settings.fx >= 2) {
    const pulse = 1 + 0.12 * Math.sin(now / 90);
    const r = (34 + Math.min(34, a / 12)) * pulse;
    const g = ctx.createRadialGradient(drag.x, drag.y, 0, drag.x, drag.y, r);
    g.addColorStop(0, glowColor(0.55)); g.addColorStop(0.4, glowColor(0.22)); g.addColorStop(1, glowColor(0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(drag.x, drag.y, r, 0, TAU); ctx.fill();
  }

  // 波紋
  if (settings.fx >= 1) for (const r of S.ripples) {
    const t = r.life / r.max;
    ctx.strokeStyle = glowColor(0.7 * t * r.s);
    ctx.lineWidth = 1.5 + 4 * t;
    ctx.beginPath(); ctx.arc(r.x, r.y, 10 + 80 * (1 - t) * r.s, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

// ぶれ用の画像：アーム1枚と、ぶれきった「円盤」を事前に作っておく（毎コマの描画を軽くする）
let sprite = null;
function getSprite() {
  const dyn = settings.theme === 'neon' || settings.theme === 'rainbow';
  const key = [settings.theme, settings.arms, Math.round(R), dpr, dyn ? Math.round(S.hue / 30) : 0].join('|');
  if (sprite && sprite.key === key) return sprite;
  const size = Math.ceil(2 * R * dpr);
  const arm = sprite ? sprite.arm : document.createElement('canvas');
  const disc = sprite ? sprite.disc : document.createElement('canvas');
  arm.width = arm.height = size; disc.width = disc.height = size;
  const c1 = arm.getContext('2d');
  c1.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawSpinner(0, false, c1, R, R);
  // 円盤：アームをピッチ1本ぶん細かく回しながら重ねる（回転しても見た目が変わらない）
  const c2 = disc.getContext('2d');
  const M = 120, pitch = TAU / settings.arms;
  c2.globalAlpha = Math.min(1, 2.4 / M);
  for (let k = 0; k < M; k++) {
    c2.save();
    c2.translate(size / 2, size / 2);
    c2.rotate(-pitch * k / (M - 1));
    c2.drawImage(arm, -size / 2, -size / 2);
    c2.restore();
  }
  sprite = { key, arm, disc };
  return sprite;
}

// カメラのシャッターが開いている間に回った角度ぶんを重ねて描く（コマ送りで止まって見える現象を防ぐ）
function drawBlurred(arc, weight) {
  const spr = getSprite(), pitch = TAU / settings.arms;
  const d = Math.min(1, Math.max(0, (arc - 0.35 * pitch) / (0.65 * pitch)));
  const dd = d * d * (3 - 2 * d);                      // ぶれが大きいほど円盤に近づく
  ctx.save();
  ctx.translate(cx, cy);
  if (dd > 0) { ctx.globalAlpha = dd * weight; ctx.drawImage(spr.disc, -R, -R, 2 * R, 2 * R); }
  if (dd < 1) {
    const M = Math.min(14, Math.max(3, Math.ceil(arc / 0.05) + 1));
    const sgn = Math.sign(S.omega) || 1;
    ctx.globalAlpha = Math.min(1, 2.4 / M) * (1 - dd) * weight;
    for (let k = 0; k < M; k++) {
      ctx.save();
      ctx.rotate(S.theta - sgn * arc * (k / (M - 1)));
      ctx.drawImage(spr.arm, -R, -R, 2 * R, 2 * R);
      ctx.restore();
    }
  }
  ctx.restore();
}

function draw(a) {
  const P = THEME[settings.theme];
  // 背景（回すほど少し明るくなる）
  const glow = (1 - Math.exp(-S.L / 3.2)) * FXM[settings.fx];
  // 背景の光源は傾けた方向に動き、色味も変わる（右＝暖色、左＝寒色）
  const gcx = cx + S.tx * W * 0.5, gcy = cy + S.ty * H * 0.2;
  const g = ctx.createRadialGradient(gcx, gcy, R * 0.1, gcx, gcy, Math.max(W, H) * 0.75);
  g.addColorStop(0, `rgb(${30 + glow * 50 + Math.max(0, S.tx) * 70 | 0},${36 + glow * 40 + S.ty * 8 | 0},${52 + glow * 60 + Math.max(0, -S.tx) * 80 | 0})`);
  g.addColorStop(1, '#050608');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 傾けた側にたまる光（スマホの中で光が流れるように動く）
  const tm = Math.min(1, Math.hypot(S.tx, S.ty * 0.6));
  if (tm > 0.03) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const ax = cx + S.tx * W * 0.7, ay = cy - S.ty * H * 0.18 + H * 0.1;
    const ag = ctx.createRadialGradient(ax, ay, 0, ax, ay, Math.max(W, H) * 0.6);
    ag.addColorStop(0, glowColor(0.22 * tm)); ag.addColorStop(1, glowColor(0));
    ctx.fillStyle = ag; ctx.fillRect(0, 0, W, H); ctx.restore();
  }

  // 空気のちり（回転に引っぱられて流れる）
  if (settings.fx >= 2) for (const d of DUST) {
    ctx.fillStyle = glowColor(d.al * (0.5 + Math.min(1, a / 200)));
    ctx.beginPath();
    ctx.arc(cx + Math.cos(d.a) * d.k * R * 0.95 + S.tx * d.k * R * 0.18, cy + Math.sin(d.a) * d.k * R * 1.05 + S.ty * d.k * R * 0.12, d.s, 0, TAU);
    ctx.fill();
  }
  // 速いほど強くなる光のにじみ
  if (a > 30 && settings.fx > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.6);
    gr.addColorStop(0, glowColor((0.08 + 0.34 * (1 - Math.exp(-S.L / 3.5))) * FXM[settings.fx])); gr.addColorStop(1, glowColor(0));
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // 画面の揺れとズーム（はじいた瞬間・高速時）
  ctx.save();
  const zoom = 1 + (settings.fx >= 2 ? 0.045 * (1 - Math.exp(-S.L / 4)) : 0);
  ctx.translate(cx + (Math.random() - 0.5) * 16 * S.shake, cy + (Math.random() - 0.5) * 16 * S.shake);
  ctx.scale(zoom, zoom);
  ctx.translate(-cx, -cy);

  // 床の影
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(cx - S.tx * R * 0.3, cy + R * 1.08 + S.ty * R * 0.08, R * 0.95, R * 0.14, 0, 0, TAU); ctx.fill();

  // 1コマで回る角度に応じて、くっきり → ぶれ へ滑らかに切り替える
  const pitch = TAU / settings.arms;
  const arc = Math.min(a * S.frameDt * 0.6, pitch);         // シャッター開放中に回る角度（アーム1本ぶんが上限）
  const blend = Math.min(1, Math.max(0, (arc - 0.12) / 0.3));
  if (blend < 1) { ctx.globalAlpha = 1 - blend; drawSpinner(S.theta, true); ctx.globalAlpha = 1; }
  if (blend > 0) drawBlurred(Math.max(arc, 0.12), blend);

  // 先端の光の尾（彗星のように伸びる）
  if (a > 40 && settings.fx > 0) {
    const n = settings.arms, step = TAU / n, sgn = Math.sign(S.omega) || 1;
    const len = 0.2 + 1.2 * (1 - Math.exp(-S.L / 3)), al = Math.min(1, a / 120);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'butt'; ctx.lineWidth = R * 0.06;
    for (let k = 0; k < n; k++) {
      const ang = S.theta + k * step;
      for (let j = 0; j < 6; j++) {
        const a0 = sgn > 0 ? ang - len * (j + 1) / 6 : ang + len * j / 6;
        const a1 = sgn > 0 ? ang - len * j / 6 : ang + len * (j + 1) / 6;
        ctx.strokeStyle = glowColor(0.5 * al * FXM[settings.fx] * (1 - j / 6));
        ctx.beginPath(); ctx.arc(cx, cy, R * 0.84, a0, a1); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // 火花
  for (const p of S.particles) {
    const t = Math.max(0, p.life / p.max);
    ctx.strokeStyle = `rgba(${P.spark},${t})`;
    ctx.lineWidth = 0.5 + 2 * t;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
    ctx.stroke();
  }

  // 衝撃波のリング
  for (const r of S.rings) {
    const t = r.life / r.max;
    ctx.strokeStyle = glowColor(0.6 * t * r.s);
    ctx.lineWidth = 2 + 6 * t * r.s;
    ctx.beginPath(); ctx.arc(cx, cy, r.r, 0, TAU); ctx.stroke();
  }
  ctx.restore();

  drawFinger(a);

  // 節目の閃光
  if (S.flash > 0.02) {
    ctx.fillStyle = `rgba(255,255,255,${S.flash * 0.16})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- メインループ ---------- */
let lastFrame = performance.now();
function frame(now) {
  const rawDt = Math.max(0, (now - lastFrame) / 1000);
  lastFrame = now;
  const dt = Math.min(1 / 30, rawDt);                       // 演出用
  S.frameDt = Math.min(0.05, Math.max(1 / 240, rawDt));     // 1コマの長さ（ぶれの量に使う）
  // 物理は細かい刻みで、実際に経った時間ぶん進める（コマ落ちしても回転が遅れない）
  const simDt = Math.min(0.1, rawDt), steps = Math.max(1, Math.ceil(simDt / 0.008));
  for (let i = 0; i < steps; i++) { if (drag) dragPhysics(simDt / steps, now); else physics(simDt / steps); }
  const otx = S.tx, oty = S.ty;
  S.tx += (S.tx0 - S.tx) * (1 - Math.exp(-dt * 8));
  S.ty += (S.ty0 - S.ty) * (1 - Math.exp(-dt * 8));
  // スマホの動きの「今」「しばらくの傾向」「開いてからの合計」
  const tiltSpeed = (Math.abs(S.tx - otx) + Math.abs(S.ty - oty)) / Math.max(dt, 0.001);
  S.acc += (S.acc0 - S.acc) * (1 - Math.exp(-dt * 10));
  S.acc0 *= Math.exp(-dt * 2);
  S.shakeE = Math.max(S.acc, S.shakeE * Math.exp(-dt * 3));
  S.moveTotal += S.acc * dt * 0.4 + tiltSpeed * dt * 3;
  S.txSlow += (S.tx - S.txSlow) * (1 - Math.exp(-dt / 10));
  S.tySlow += (S.ty - S.tySlow) * (1 - Math.exp(-dt / 10));
  if (S.shakeE > 2.5 && now - S.lastRattle > 55) { S.lastRattle = now; rattle(Math.min(1, S.shakeE / 12)); }
  S.hue = (S.hue + dt * 25) % 360;

  S.turns += Math.abs(S.theta - S.prevTheta) / TAU;
  S.prevTheta = S.theta;

  // ブレードが固定点を通過したらティック
  const step = TAU / settings.arms;
  const idx = Math.floor(S.theta / step);
  if (S.tickIdx === null) S.tickIdx = idx;
  if (idx !== S.tickIdx) { S.tickIdx = idx; onTick(Math.abs(S.omega)); }

  const a = Math.abs(S.omega);
  S.L = Math.log2(1 + a / 40);                              // 体感の速さ（対数）
  const rpm = Math.round(a * 60 / TAU);
  if (rpm !== S.lastRpm) { S.lastRpm = rpm; rpmEl.textContent = rpm.toLocaleString('en-US'); }
  if (rpm < 150) { S.milestone = 0; S.recordShown = false; }
  for (let i = 0; i < MILES.length; i++) {
    if (rpm >= MILES[i] && S.milestone < MILES[i]) {
      S.milestone = MILES[i];
      showToast(`${MILES[i].toLocaleString('en-US')} RPM!`); thump(1); chime(i);
      if (settings.fx >= 2) { addRing(1); S.flash = 1; }
    }
  }
  if (rpm > settings.best) {
    if (settings.best >= 300 && !S.recordShown) {
      S.recordShown = true; showToast('NEW RECORD!'); chime(4);
      if (settings.fx >= 2) { S.flash = 0.6; addRing(1); }
    }
    settings.best = rpm; dirty = true;
  }
  if (dirty && now - lastSave > 1500) { saveSettings(); dirty = false; lastSave = now; }

  if (Math.floor(now / 250) !== frame.lastStat) {
    frame.lastStat = Math.floor(now / 250);
    statsEl.textContent = `最高 ${settings.best.toLocaleString('en-US')} rpm ・ 今回 ${Math.floor(S.turns)} 回転`;
  }

  audioUpdate();
  spawnSparks(a);
  updateParticles(dt);
  updateFx(dt);
  draw(a);
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
function refreshUI() {
  const P = THEME[settings.theme];
  document.documentElement.style.setProperty('--accent', P.accent);
  bTheme.textContent = `テーマ：${THEME_NAME[settings.theme]}`;
  bArms.textContent = `${settings.arms}本`;
  bSound.textContent = `音：${settings.sound ? 'ON' : 'OFF'}`;
  bSound.setAttribute('aria-pressed', settings.sound);
  bTimbre.textContent = `音色：${TIMBRE_NAME[settings.timbre]}`;
  bVib.textContent = canHaptic ? `振動：${settings.vib ? 'ON' : 'OFF'}` : '振動（非対応）';
  bVib.disabled = !canHaptic;
  bVib.setAttribute('aria-pressed', settings.vib && canHaptic);
  bBass.textContent = `音で振動：${settings.bass ? 'ON' : 'OFF'}`;
  bBass.setAttribute('aria-pressed', settings.bass);
  bTilt.textContent = `傾き・動き：${settings.tilt ? 'ON' : 'OFF'}${settings.tilt && S.tiltReq && !S.tiltSeen && !S.motionSeen ? '（未検出）' : ''}`;
  bFx.textContent = `演出：${FX_NAME[settings.fx]}`;
  bTilt.setAttribute('aria-pressed', settings.tilt);
  if (ac && master) master.gain.setTargetAtTime(settings.sound ? 0.9 : 0, ac.currentTime, 0.05);
}

function cycle(list, cur) { return list[(list.indexOf(cur) + 1) % list.length]; }

bTheme.addEventListener('click', () => { settings.theme = cycle(THEMES, settings.theme); S.hue = 200; saveSettings(); refreshUI(); });
bArms.addEventListener('click', () => { settings.arms = cycle(ARMS, settings.arms); S.tickIdx = null; saveSettings(); refreshUI(); });
bSound.addEventListener('click', () => { initAudio(); settings.sound = !settings.sound; saveSettings(); refreshUI(); });
bTimbre.addEventListener('click', () => { settings.timbre = cycle(TIMBRES, settings.timbre); saveSettings(); refreshUI(); });
bVib.addEventListener('click', () => { settings.vib = !settings.vib; saveSettings(); refreshUI(); vib(10); });
bBass.addEventListener('click', () => { initAudio(); settings.bass = !settings.bass; saveSettings(); refreshUI(); thump(1); });
bTilt.addEventListener('click', () => {
  initAudio();
  settings.tilt = !settings.tilt; saveSettings();
  if (settings.tilt) { S.tiltReq = false; S.b0 = null; enableTilt(); } else { S.tx0 = 0; S.ty0 = 0; }
  refreshUI();
});
bFx.addEventListener('click', () => {
  settings.fx = settings.fx === 1 ? 2 : settings.fx === 2 ? 0 : 1;   // 控えめ → フル → 最小 → 控えめ
  saveSettings(); refreshUI();
});
bStop.addEventListener('click', () => { initAudio(); S.omega = 0; });

// 別タブに行った時は音を止める
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else ac.resume();
});

refreshUI();
// 許可が要らない端末（Androidなど）は最初から傾きを使う。iPhoneは最初のタッチで許可を求める
if (!(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')) enableTilt();
setTimeout(() => { hintEl.style.opacity = 0; }, 6000);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
