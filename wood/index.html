<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a4a21">
<title>木目しらべ</title>
<style>
:root{--bg:#f6efe3;--card:#fffaf0;--ink:#3b2a1a;--sub:#7d6850;--brand:#7a4a21;--brand2:#a8672d;--line:#e4d5bc;--ok:#3d7a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
header{background:linear-gradient(180deg,#8a5426,#6c3f1a);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:19px;letter-spacing:.04em}
header button{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 40px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 8px;color:var(--brand)}
.shoot{display:block;width:100%;text-align:center;background:var(--brand);color:#fff;border-radius:14px;padding:18px;font-size:18px;font-weight:700;border:0;box-shadow:0 3px 0 #4e2c10}
.shoot:active{transform:translateY(3px);box-shadow:none}
.btn{background:#fff;border:1.5px solid var(--brand);color:var(--brand);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
.btn.primary{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.thumbs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb b{position:absolute;left:0;bottom:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;text-align:center;padding:1px}
.thumb i{position:absolute;right:2px;top:2px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-style:normal;line-height:22px}
.tips{font-size:13px;color:var(--sub);margin:8px 0 0;padding-left:1.2em}
.sp{border-bottom:1px dashed var(--line);padding:8px 0}.sp:last-child{border:0}
.sp .n{font-weight:700;font-size:17px}.sp .sci{font-size:12px;color:var(--sub);font-style:italic}
.bar{height:8px;border-radius:4px;background:#eadfca;margin:4px 0;overflow:hidden}.bar>div{height:100%;background:var(--brand2)}
.pct{font-size:12px;color:var(--sub)}
.tag{display:inline-block;background:#efe2c8;border-radius:999px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:4px 8px;font-size:14px}.kv dt{color:var(--sub)}.kv dd{margin:0}
.big{font-size:22px;font-weight:800}
.caveat{font-size:12px;color:var(--sub)}
.err{color:#b3261e;font-size:14px}
.loading{text-align:center;padding:26px 0}
.spin{width:34px;height:34px;border:4px solid #e4d5bc;border-top-color:var(--brand);border-radius:50%;margin:0 auto 10px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.hist{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.hist img{width:56px;height:56px;border-radius:8px;object-fit:cover}
.hist button{all:unset;display:flex;gap:10px;align-items:center;width:100%;cursor:pointer}
dialog{border:0;border-radius:14px;padding:16px;max-width:92vw;width:420px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
input[type=password],input[type=text]{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;margin:6px 0}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>🪵 木目しらべ</h1><button id="gear" aria-label="設定">⚙️</button></header>
<main>
  <div class="card">
    <button class="shoot" id="shoot">📷 木目を撮る</button>
    <input type="file" id="file" accept="image/*" capture="environment" class="hidden">
    <input type="file" id="pick" accept="image/*" class="hidden">
    <div class="thumbs" id="thumbs"></div>
    <div class="row" id="actions" style="display:none">
      <button class="btn" id="add">＋ 写真を足す（木口など）</button>
      <button class="btn" id="gallery">アルバムから</button>
      <button class="btn primary" id="go">しらべる</button>
    </div>
    <ul class="tips">
      <li>明るい場所で、木目にピントを合わせて近くから</li>
      <li>フラッシュはテカるのでオフ。影も避けて</li>
      <li>切り口（木口）があれば、もう1枚足すと当たりやすい</li>
    </ul>
  </div>
  <div id="result"></div>
  <div class="card" id="histCard" style="display:none"><h2>これまでの結果</h2><div id="hist"></div></div>
</main>

<dialog id="dlg">
  <h2>設定</h2>
  <p style="font-size:13px;margin:0 0 6px">AI（Claude）に写真を送って判定します。<br>あなたの <b>Anthropic APIキー</b> を入れてください。</p>
  <input type="password" id="key" placeholder="sk-ant-..." autocomplete="off">
  <p class="caveat">キーはこのスマホの中だけに保存され、判定のときに Anthropic にだけ送られます。使いすぎ防止に、Anthropic のコンソールで月の上限を設定しておくと安心です。</p>
  <div class="row"><button class="btn primary" id="save">保存</button><button class="btn" id="close">とじる</button><button class="btn" id="clear">履歴を消す</button></div>
</dialog>

<script>
(()=>{
'use strict';
const MODEL='claude-sonnet-5-5';
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
};
let photos=[]; // {data(base64 jpeg), url}
const MAXP=3,LABELS=['表面','追加1','追加2'];

/* ---------- photos ---------- */
async function shrink(file,max,q){
  const bmp=await createImageBitmap(file);
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
async function addFile(f){
  if(!f)return;
  if(photos.length>=MAXP){return;}
  try{const url=await shrink(f,1280,.85);photos.push({url,data:url.split(',')[1]});renderThumbs();}
  catch(e){showErr('写真を読み込めませんでした');}
}
function renderThumbs(){
  $('thumbs').innerHTML='';
  photos.forEach((p,i)=>{
    const d=document.createElement('div');d.className='thumb';
    d.innerHTML=`<img src="${p.url}"><b>${i?'写真'+(i+1):'表面'}</b><i data-i="${i}">×</i>`;
    $('thumbs').appendChild(d);
  });
  $('actions').style.display=photos.length?'flex':'none';
  $('add').style.display=photos.length&&photos.length<MAXP?'':'none';
  $('gallery').style.display=photos.length<MAXP?'':'none';
  $('shoot').textContent=photos.length?'📷 撮りなおす':'📷 木目を撮る';
}
$('thumbs').onclick=e=>{const i=e.target.dataset.i;if(i!=null){photos.splice(+i,1);renderThumbs();}};
$('shoot').onclick=()=>{photos=[];renderThumbs();$('result').innerHTML='';$('file').click();};
$('add').onclick=()=>$('file').click();
$('gallery').onclick=()=>$('pick').click();
$('file').onchange=async e=>{await addFile(e.target.files[0]);e.target.value='';};
$('pick').onchange=async e=>{for(const f of [...e.target.files].slice(0,MAXP-photos.length))await addFile(f);e.target.value='';};

/* ---------- AI ---------- */
const SYSTEM=`あなたは木材と木工に詳しい樹種鑑定の専門家です。送られた写真（木目・木口など）から、樹種と板材の種類を推定します。
必ず次のJSONだけを返してください（前後に文章やコードブロックを付けない）。
{
 "is_wood": true/false,
 "summary": "ひとことでの結論（日本語・30字程度）",
 "species": [{"name":"和名（例：ナラ（オーク））","scientific":"属名または学名","confidence":0-100の整数,"reason":"写真のどこからそう判断したか"}],
 "cut": {"type":"板目|柾目|追柾|木口|不明","note":"木目の取り方の説明"},
 "material": {"type":"無垢材|集成材|合板|突板（化粧板）|プリント化粧板|不明","note":"根拠（接ぎ目、層、模様の繰り返しなど）"},
 "hardness": "やわらかい|ふつう|かたい|不明",
 "uses": ["向く用途を2〜3個"],
 "tips": "判定を確かにするための撮り方や確認方法（木口を撮る、重さ、香り、削った面など）",
 "caveat": "判定の限界や、他の候補と間違えやすい点"
}
speciesは可能性の高い順に最大3つ。confidenceの合計が100を超えないように。写真が木材でない・判定できない場合は is_wood を false にし、summary と tips に理由と撮り直しのコツを書く。確実でないことは断定せず、confidenceを低めにする。`;

function parseJSON(t){
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<a)throw new Error('結果を読み取れませんでした');
  return JSON.parse(t.slice(a,b+1));
}
async function analyze(){
  const key=store.get('woodkey','');
  if(!key){$('dlg').showModal();return;}
  const content=photos.map(p=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:p.data}}));
  content.push({type:'text',text:`写真は${photos.length}枚です（1枚目が表面、他は木口など）。樹種と板材の種類を判定してください。`});
  $('result').innerHTML='<div class="card loading"><div class="spin"></div>AIが木目を観察中…</div>';
  $('go').disabled=true;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
      'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODEL,max_tokens:1800,system:SYSTEM,messages:[{role:'user',content}]})});
    if(!r.ok){
      let m='';try{m=(await r.json()).error.message;}catch(e){}
      if(r.status===401)throw new Error('APIキーが正しくないようです（⚙️で確認してね）');
      if(r.status===429)throw new Error('使いすぎ、またはアクセスが集中しています。少し待ってね');
      throw new Error('判定に失敗しました（'+r.status+'）'+(m?' '+m:''));
    }
    const j=await r.json();
    const res=parseJSON(j.content.filter(c=>c.type==='text').map(c=>c.text).join(''));
    renderResult(res);saveHist(res);
  }catch(e){showErr(e.message==='Failed to fetch'?'通信できませんでした。電波を確認してね':e.message);}
  finally{$('go').disabled=false;}
}
$('go').onclick=analyze;

/* ---------- render ---------- */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showErr(m){$('result').innerHTML=`<div class="card err">⚠️ ${esc(m)}</div>`;}
function renderResult(r){
  if(!r.is_wood){
    $('result').innerHTML=`<div class="card"><h2>うまく判定できませんでした</h2><p>${esc(r.summary)}</p><p class="tips" style="padding:0;list-style:none">${esc(r.tips)}</p></div>`;return;
  }
  const sp=(r.species||[]).map(s=>`<div class="sp"><div class="n">${esc(s.name)}</div><div class="sci">${esc(s.scientific)}</div>
    <div class="bar"><div style="width:${Math.max(2,Math.min(100,+s.confidence||0))}%"></div></div>
    <div class="pct">${+s.confidence||0}%　${esc(s.reason)}</div></div>`).join('');
  $('result').innerHTML=`
  <div class="card"><div class="big">${esc(r.species?.[0]?.name||'？')}</div><div>${esc(r.summary)}</div></div>
  <div class="card"><h2>🌳 樹種の候補</h2>${sp}</div>
  <div class="card"><h2>🪚 板材のようす</h2><dl class="kv">
    <dt>木取り</dt><dd><b>${esc(r.cut?.type)}</b><br>${esc(r.cut?.note)}</dd>
    <dt>材の種類</dt><dd><b>${esc(r.material?.type)}</b><br>${esc(r.material?.note)}</dd>
    <dt>かたさ</dt><dd>${esc(r.hardness)}</dd>
    <dt>向く用途</dt><dd>${(r.uses||[]).map(u=>`<span class="tag">${esc(u)}</span>`).join('')}</dd></dl></div>
  <div class="card"><h2>🔎 もっと確かめるには</h2><p style="margin:0">${esc(r.tips)}</p>
    <p class="caveat">${esc(r.caveat)}<br>※AIの推定です。購入や加工の判断には、専門家や木材店にも確認してください。</p></div>`;
  scrollTo({top:$('result').offsetTop-8,behavior:'smooth'});
}

/* ---------- history ---------- */
async function thumbOf(url){const b=await (await fetch(url)).blob();return shrink(b,140,.6);}
async function saveHist(r){
  try{
    const h=store.get('woodhist',[]);
    h.unshift({t:Date.now(),th:await thumbOf(photos[0].url),r});
    store.set('woodhist',h.slice(0,15));renderHist();
  }catch(e){}
}
function renderHist(){
  const h=store.get('woodhist',[]);
  $('histCard').style.display=h.length?'block':'none';
  $('hist').innerHTML=h.map((x,i)=>`<div class="hist"><button data-i="${i}"><img src="${x.th}"><span><b>${esc(x.r.species?.[0]?.name||'判定なし')}</b><br><span class="caveat">${esc(x.r.cut?.type||'')} ・ ${esc(x.r.material?.type||'')} ・ ${new Date(x.t).toLocaleDateString('ja-JP')}</span></span></button></div>`).join('');
}
$('hist').onclick=e=>{const b=e.target.closest('button');if(!b)return;const x=store.get('woodhist',[])[+b.dataset.i];if(x)renderResult(x.r);};

/* ---------- settings ---------- */
$('gear').onclick=()=>{$('key').value=store.get('woodkey','');$('dlg').showModal();};
$('close').onclick=()=>$('dlg').close();
$('save').onclick=()=>{store.set('woodkey',$('key').value.trim());$('dlg').close();};
$('clear').onclick=()=>{store.set('woodhist',[]);renderHist();$('dlg').close();};
renderHist();renderThumbs();
})();
</script>
</body>
</html>
